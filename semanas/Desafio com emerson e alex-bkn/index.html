
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake VII</title>
<style>
body {
  background: #101820;
  color: white;
  font-family: Arial;
  text-align: center;
}
canvas {
  background: #1b3026;
  border: 4px solid #55dd77;
  width: min(90vw, 400px);
}
button {
  padding: 12px 20px;
  margin: 8px;
  border: 0;
  border-radius: 10px;
  background: #55dd77;
  font-size: 18px;
}
</style>
</head>
<body>
<h1>🐍 SNAKE VII 🍎</h1>
<h2>Pontos: <span id="score">0</span></h2>
<canvas id="game" width="400" height="400"></canvas>
<p>Use WASD ou as setas para jogar!</p>
<button onclick="startGame()">JOGAR / REINICIAR</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const size = 20;
let snake, apple, dx, dy, score, running, timer;

function newApple() {
  let a;
  do {
    a = {
      x: Math.floor(Math.random()*20)*size,
      y: Math.floor(Math.random()*20)*size
    };
  } while (snake.some(p => p.x === a.x && p.y === a.y));
  return a;
}

function startGame() {
  clearTimeout(timer);
  snake = [{x:200,y:200}];
  dx = size;
  dy = 0;
  score = 0;
  running = true;
  document.getElementById("score").textContent = score;
  apple = newApple();
  draw();
}

document.addEventListener("keydown", e => {
  let k = e.key.toLowerCase();
  if (["arrowup","arrowdown","arrowleft","arrowright"].includes(k)) e.preventDefault();

  if ((k==="arrowup" || k==="w") && dy===0) {dx=0;dy=-size;}
  else if ((k==="arrowdown" || k==="s") && dy===0) {dx=0;dy=size;}
  else if ((k==="arrowleft" || k==="a") && dx===0) {dx=-size;dy=0;}
  else if ((k==="arrowright" || k==="d") && dx===0) {dx=size;dy=0;}
});

function draw() {
  if (!running) return;

  ctx.fillStyle = "#1b3026";
  ctx.fillRect(0,0,400,400);

  let head = {x:snake[0].x+dx,y:snake[0].y+dy};

  let eating = head.x===apple.x && head.y===apple.y;

  if (
    head.x<0 || head.x>=400 ||
    head.y<0 || head.y>=400 ||
    snake.slice(0,eating ? snake.length : -1)
      .some(p=>p.x===head.x && p.y===head.y)
  ) {
    running=false;
    ctx.fillStyle="white";
    ctx.font="30px Arial";
    ctx.fillText("FIM DE JOGO!",85,190);
    ctx.font="18px Arial";
    ctx.fillText("Clique em reiniciar!",110,225);
    return;
  }

  snake.unshift(head);

  if (eating) {
    score++;
    document.getElementById("score").textContent=score;
    apple=newApple();
  } else {
    snake.pop();
  }

  ctx.font="20px Arial";
  ctx.fillText("🍎",apple.x,apple.y+19);

  snake.forEach((p,i)=>{
    ctx.fillStyle=i===0 ? "#aaff55" : "#44cc66";
    ctx.fillRect(p.x+1,p.y+1,18,18);
  });

  timer=setTimeout(draw,Math.max(65,150-score*3));
}

startGame();
</script>
</body>
</html>
